name: Renovate

on:
  schedule:
    - cron: '23 6 * * *'
      timezone: Europe/Vienna
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview updates in the logs
        type: boolean
        default: true

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Run Renovate
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_USERNAME: github-actions[bot]
          RENOVATE_GIT_AUTHOR: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: gradleWrapper
          LOG_LEVEL: ${{ inputs.dry_run && 'debug' || 'info' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--platform=github --onboarding=false --require-config=required)
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run=full)
          fi

          docker run --rm \
            --env RENOVATE_TOKEN \
            --env RENOVATE_USERNAME \
            --env RENOVATE_GIT_AUTHOR \
            --env RENOVATE_ALLOWED_UNSAFE_EXECUTIONS \
            --env LOG_LEVEL \
            ghcr.io/renovatebot/renovate:44.220.0@sha256:71599a2007228ada2cc6acb5ed836cf2c088537ffe76dafee1ee6a1c5c45d5e5 \
            "${args[@]}" "$GITHUB_REPOSITORY"

spring:
  application:
    name: paperless-customGPT
  ai:
    mcp:
      server:
        name: paperless-customGPT
        version: 0.0.1
  datasource:
    url: ${PAPERLESS_DB_URL}
    username: ${PAPERLESS_DB_USER}
    password: ${PAPERLESS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: paperless_rag
    default-schema: paperless_rag
  security:
    oauth2:
      client:
        registration:
          authentik:
            provider: authentik
            client-id: ${AUTHENTIK_CLIENT_ID}
            client-secret: ${AUTHENTIK_CLIENT_SECRET}
            client-name: Authentik
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          authentik:
            issuer-uri: ${AUTHENTIK_ISSUER_URI}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${AUTHENTIK_ISSUER_URI}
springdoc:
  api-docs:
    path: /api/openapi.json
server:
  forward-headers-strategy: framework

rag:
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  hnsw-ef-search: ${RAG_HNSW_EF_SEARCH:400}
  reranker:
    enabled: ${RAG_RERANKER_ENABLED:true}
    model-name: ${RAG_RERANKER_MODEL_NAME:}
    candidate-multiplier: ${RAG_RERANKER_CANDIDATE_MULTIPLIER:4}
    max-candidates: ${RAG_RERANKER_MAX_CANDIDATES:40}
    timeout-minutes: ${RAG_RERANKER_TIMEOUT_MINUTES:2}
  splitter:
    chunk-size-tokens: ${RAG_SPLITTER_CHUNK_TOKENS:512}
    overlap-size-tokens: ${RAG_SPLITTER_OVERLAP_TOKENS:128}
    estimated-chars-per-token: ${RAG_SPLITTER_ESTIMATED_CHARS_PER_TOKEN:4.0}

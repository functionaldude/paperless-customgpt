spring:
  application:
    name: paperless-customGPT
  ai:
    mcp:
      server:
        name: paperless-customGPT
        version: 0.0.1
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
  datasource:
    url: ${PAPERLESS_DB_URL}
    username: ${PAPERLESS_DB_USER}
    password: ${PAPERLESS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: paperless_rag
    default-schema: paperless_rag
springdoc:
  api-docs:
    path: /api/openapi.json
server:
  forward-headers-strategy: framework

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  auth:
    login-mode: ${APP_AUTH_LOGIN_MODE:LOCAL}
    local:
      username: ${APP_LOCAL_USERNAME:paperless}
      password: ${APP_LOCAL_PASSWORD:paperless-change-me}
    authentik:
      issuer-uri: ${AUTHENTIK_ISSUER_URI:}
      client-id: ${AUTHENTIK_CLIENT_ID:}
      client-secret: ${AUTHENTIK_CLIENT_SECRET:}
      scopes: openid,profile,email
  oauth:
    key-id: ${APP_OAUTH_KEY_ID:paperless-customgpt-key}
    private-key-pem: ${APP_OAUTH_PRIVATE_KEY_PEM:}
    public-key-pem: ${APP_OAUTH_PUBLIC_KEY_PEM:}

rag:
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  hnsw-ef-search: ${RAG_HNSW_EF_SEARCH:400}
  splitter:
    chunk-size-tokens: ${RAG_SPLITTER_CHUNK_TOKENS:512}
    overlap-size-tokens: ${RAG_SPLITTER_OVERLAP_TOKENS:128}
    estimated-chars-per-token: ${RAG_SPLITTER_ESTIMATED_CHARS_PER_TOKEN:4.0}

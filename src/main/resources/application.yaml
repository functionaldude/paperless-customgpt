spring:
  application:
    name: paperless-customGPT
  ai:
    mcp:
      server:
        name: paperless-customGPT
        version: 0.0.1
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
  datasource:
    url: ${PAPERLESS_DB_URL}
    username: ${PAPERLESS_DB_USER}
    password: ${PAPERLESS_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO paperless_rag,public
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: paperless_rag
    default-schema: paperless_rag
server:
  forward-headers-strategy: framework

logging:
  level:
    mcp.tools: ${MCP_TOOL_LOGGING:OFF}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  auth:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000/application/o/paperless/}
    audience: ${OIDC_AUDIENCE:}
    scopes: ${OIDC_SCOPES:openid,profile,email,paperless_gpt,offline_access}
    required-scope: ${OIDC_REQUIRED_SCOPE:paperless_gpt}

rag:
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  hnsw-ef-search: ${RAG_HNSW_EF_SEARCH:400}
  splitter:
    chunk-size-tokens: ${RAG_SPLITTER_CHUNK_TOKENS:512}
    overlap-size-tokens: ${RAG_SPLITTER_OVERLAP_TOKENS:128}
    estimated-chars-per-token: ${RAG_SPLITTER_ESTIMATED_CHARS_PER_TOKEN:4.0}
